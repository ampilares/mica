[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/allenpilares/mica"

[workspace.dependencies]
mica-core = { path = "crates/mica-core" }
mica-vault = { path = "crates/mica-vault" }
mica-markdown = { path = "crates/mica-markdown" }
mica-db = { path = "crates/mica-db" }
mica-drawio = { path = "crates/mica-drawio" }
mica-search = { path = "crates/mica-search" }
mica-watch = { path = "crates/mica-watch" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
ulid = "1"
blake3 = "1"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }
pulldown-cmark = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7"
notify-debouncer-full = "0.4"
quick-xml = "0.37"
tempfile = "3"
trash = "5"
walkdir = "2"
regex = "1"
ureq = { version = "2", features = ["tls"] }
tracing = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
